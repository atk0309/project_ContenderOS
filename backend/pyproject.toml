[project]
name = "contender-backend"
version = "0.1.0"
description = "Contender backend — FastAPI service: AI agent panel, persistence, auth, the provenance gate."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.139.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.14.2",
  "uvicorn[standard]>=0.51.0",
  "anthropic>=0.118.0",  # messages.parse/parsed_output (structured outputs) — verified vs 0.109.2
  "openai>=2.47.0",        # adjudication + list-models; non-beta responses.parse (verified vs 2.43.0)
  "sqlalchemy[asyncio]>=2.0.51",  # persistence (admin-managed provider config)
  "asyncpg>=0.30",      # async Postgres driver for SQLAlchemy
  "cryptography>=43",   # Fernet — encrypt provider API keys at rest (was transitive via authlib)
  "authlib>=1.3",       # Entra ID OIDC (M365 SSO)
  "itsdangerous>=2.2",  # signed session cookie (Starlette SessionMiddleware) + magic-link tokens
  "httpx>=0.27",        # Authlib OIDC calls + Resend magic-link email
  "python-multipart>=0.0.32",  # FastAPI multipart/form parsing — the PDF UploadFile route (PR-C)
  "pypdf>=6.14.2",      # PDF → text for audit/evidence/page-guard (NOT the extraction path; ADR 0007)
]

[project.optional-dependencies]
dev = [
  "ruff>=0.15.22",
  "mypy>=2.3.0",
  "pytest>=9.1.1",
  "aiosqlite>=0.20",  # offline test DB (sqlite+aiosqlite) so the suite needs no Postgres
  "httpx2>=2.7.0",  # Starlette 1.3 TestClient; runtime Authlib/Resend calls still use httpx
]

# Virtual project: uv never builds/installs it as a package (the Dockerfile syncs with
# --no-install-project), so there is no build backend here.
[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Lint / format (ruff) — the backend half of the local quality gate.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI Depends() in defaults is the framework idiom
  "RUF012",  # Pydantic deep-copies field defaults per instance — `= []` is safe + idiomatic here
]

# ---------------------------------------------------------------------------
# Typecheck (mypy)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false  # FastAPI route decorators are untyped

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# Authlib ships no type information — don't fail strict mypy on its imports.
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Test (pytest)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"  # -ra: show skip/xfail reasons — env-gated skips (Postgres/live-key) must be visible, not silent
